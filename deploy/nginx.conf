# Nginx in front of x-mail.
#
# The SPA and the API are served from one origin, which is what lets the
# session cookie stay SameSite=Lax with no CORS preflights — the same shape the
# Vite proxy reproduces in development.

upstream xmail_api {
    server api:8090;
}

server {
    listen 80;
    server_name _;

    # Cloudflare or whatever terminates TLS sets this; it is what makes the
    # application mark cookies Secure and build https links.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    client_max_body_size 30m;   # inbound webhooks carry attachments

    # --- API -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://xmail_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The realtime endpoint lives under /api/v1/ws, so this location has to
        # carry the upgrade as well as ordinary requests. Without these two
        # headers the socket never establishes and the mailbox silently falls
        # back to refetching.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A websocket is idle most of the time; the default 60s read timeout
        # would close it between pings.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;

        proxy_buffering off;
    }

    # --- SPA -----------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable; index.html must not be cached or a deploy
    # leaves browsers on the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# $connection_upgrade is "upgrade" only when the client asked for one, and
# "close" otherwise; sending "upgrade" unconditionally breaks plain requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
